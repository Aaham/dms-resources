<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff view | DMS resources</title>
<link rel="icon" href="/static/assets/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/static/assets/fonts.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="masthead">
  <div class="wrap masthead__bar">
    <a class="masthead__logo" href="/" aria-label="DMS resources"><img src="/static/assets/dms-logo.png" alt="DMS" width="98" height="39"></a>
    <nav class="masthead__nav" aria-label="Site"><a href="/">All resources</a></nav>
  </div>
</header>

<main id="main" class="wrap staff-link">
  <h1>Staff view</h1>
  <p>The staff view opens from a link we email to <strong id="visit-email"></strong>.</p>
  <button id="send-link" class="btn" type="button">Email me the link <span aria-hidden="true">→</span></button>
  <p id="link-message" class="message" role="status" hidden></p>
  <p class="staff-link__other"><button id="use-different-email" class="text-button" type="button">Use a different email</button></p>
</main>

<script type="module" src="/static/staff-link.js"></script>
</body>
</html>
